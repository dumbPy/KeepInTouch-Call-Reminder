name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version for the release (e.g. 1.0.0 or v1.0.0)'
        required: true
        default: '1.0.0'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

      - name: Build Release APK
        run: gradle assembleRelease --build-cache --parallel

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepInTouch-Release-APK
          path: app/build/outputs/apk/release/*.apk

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: KeepInTouch-Release-APK
          path: release-apk/

      - name: Determine Version Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            RAW_VERSION="${{ github.ref_name }}"
          fi
          RAW_VERSION=$(echo "$RAW_VERSION" | xargs)
          if [[ "$RAW_VERSION" =~ ^v[0-9] ]]; then
            TAG_NAME="$RAW_VERSION"
          else
            TAG_NAME="v$RAW_VERSION"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=Release $TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create Semantic Version Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*.apk
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release Tag
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*.apk
          tag_name: latest
          name: Latest Release (${{ steps.version.outputs.tag_name }})
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Latest release updated to version ${{ steps.version.outputs.tag_name }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
