name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepInTouch-Release-APK
          path: app/build/outputs/apk/release/*.apk

  docker-build:
    name: Build via Dockerfile.txt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image using Dockerfile.txt
        run: docker build -f Dockerfile.txt -t keepintouch:latest .

  github-release:
    name: Publish GitHub Release (Auto-synced by Uptodown)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: KeepInTouch-Release-APK
          path: release-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
